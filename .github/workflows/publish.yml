name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Configure this environment in repo Settings → Environments → npm-publish:
    #   - Deployment branches/tags: restrict to tags matching `v*` only
    #   - (Optional) Required reviewers for a manual approval before publish
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish (OIDC provenance)
        run: npm publish --provenance --access public
